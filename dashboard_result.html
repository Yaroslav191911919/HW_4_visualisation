<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e8e8e8;
            padding: 20px;
        }

        .dashboard {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .header h1 {
            font-size: 2.5rem;
            color: #ffd700;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255,215,0,0.3);
        }

        .header p {
            color: #aaa;
            font-size: 1.1rem;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .kpi-card {
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .kpi-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .kpi-card .label {
            font-size: 0.9rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .kpi-card .value {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffd700;
        }

        .kpi-card .sub {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 8px;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .chart-card h3 {
            color: #ffd700;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .chart-full {
            grid-column: 1 / -1;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255,215,0,0.3);
            background: rgba(255,255,255,0.05);
            color: #e8e8e8;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .filter-btn:hover {
            background: rgba(255,215,0,0.2);
            border-color: #ffd700;
        }

        .filter-btn.active {
            background: #ffd700;
            color: #1a1a2e;
            border-color: #ffd700;
            font-weight: bold;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 500px;
            overflow-y: auto;
        }

        .item-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            transition: background 0.3s;
        }

        .item-row:hover {
            background: rgba(255,255,255,0.1);
        }

        .item-rank {
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffd700;
            min-width: 40px;
            text-align: center;
        }

        .item-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 10px;
            background: rgba(255,255,255,0.1);
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .item-category {
            font-size: 0.8rem;
            color: #888;
        }

        .item-value {
            text-align: right;
        }

        .item-count {
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffd700;
        }

        .item-sum {
            font-size: 0.85rem;
            color: #aaa;
        }

        .bar-container {
            flex: 1;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ffaa00);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .tooltip {
            position: absolute;
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            pointer-events: none;
            z-index: 1000;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #ffd700;
            font-size: 1.5rem;
        }

            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,215,0,0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,215,0,0.5);
        }

        .d3-axis text {
            fill: #aaa;
            font-size: 11px;
        }

        .d3-axis line, .d3-axis path {
            stroke: rgba(255,255,255,0.2);
        }

        .d3-grid line {
            stroke: rgba(255,255,255,0.1);
        }
    </style>
</head>

                <h1>Дашборд заказов</h1>
                <p>Анализ потребления данных | Сентябрь 2024 — Август 2026</p>
            </div>

            <div v-if="loading" class="loading">Загрузка данных...</div>

            <template v-else>
                <!-- KPI Cards -->
                <div class="kpi-grid">
                    <div class="kpi-card">
                        <div class="label">Всего заказов</div>
                        <div class="value">{{ formatNumber(totalOrders) }}</div>
                        <div class="sub">за весь период</div>
                    </div>
                    <div class="kpi-card">
                        <div class="label">Общая сумма трат</div>
                        <div class="value">{{ formatMoney(totalSpent) }}</div>
                        <div class="sub">₽ за весь период</div>
                    </div>
                    <div class="kpi-card">

                        <div class="sub">₽ за заказ</div>
                    </div>
                    <div class="kpi-card">
                        <div class="label">Средняя скидка</div>
                        <div class="value">{{ avgDiscount.toFixed(1) }}%</div>
                        <div class="sub">от цены без скидки</div>
                    </div>
                </div>

                <!-- Filters -->
                <div class="filter-bar">
                    <button class="filter-btn" :class="{ active: selectedCategory === 'all' }" @click="selectedCategory = 'all'">
                        Все категории
                    </button>
                    <button v-for="cat in categories" :key="cat" class="filter-btn" :class="{ active: selectedCategory === cat }" @click="selectedCategory = cat">
                        {{ cat }}
                    </button>
                </div>

                <!-- Monthly Charts -->
                <div class="chart-grid">
                    <div class="chart-card chart-full">
                        <h3>Количество заказов по месяцам</h3>
                        <div ref="ordersChart"></div>
                    </div>
                    <div class="chart-card chart-full">
                        <h3>Сумма трат по месяцам</h3>
                        <div ref="spentChart"></div>
                    </div>
                    <div class="chart-card chart-full">
                        <h3>Средняя скидка по месяцам</h3>
                        <div ref="discountChart"></div>
                    </div>
                </div>

                <!-- Categories -->
                <div class="category-grid">
                    <div class="chart-card">
                        <h3>{{ selectedCategory === 'all' ? 'Распределение по категориям (заказы)' : 'Топ товаров по заказам — ' + selectedCategory }}</h3>
                        <div ref="categoryPie"></div>
                    </div>
                    <div class="chart-card">
                        <h3>{{ selectedCategory === 'all' ? 'Распределение по категориям (траты)' : 'Топ товаров по тратам — ' + selectedCategory }}</h3>
                        <div ref="categorySpentPie"></div>
                    </div>
                </div>

                <!-- Top Items -->
                <div class="chart-grid">
                    <div class="chart-card">
                        <h3>Топ товаров по количеству заказов</h3>
                        <div class="item-list">
                            <div v-for="(item, index) in topItemsByCount" :key="item.name" class="item-row">
                                <div class="item-rank">{{ index + 1 }}</div>
                                <img :src="getItemImage(item.name)" :alt="item.name" class="item-img" @error="handleImageError">
                                <div class="item-info">
                                    <div class="item-name">{{ item.name }}</div>
                                    <div class="item-category">{{ item.category }}</div>
                                    <div class="bar-container">
                                        <div class="bar-fill" :style="{ width: (item.count / topItemsByCount[0].count * 100) + '%' }"></div>
                                    </div>
                                </div>
                                <div class="item-value">
                                    <div class="item-count">{{ item.count }}</div>
                                    <div class="item-sum">{{ formatMoney(item.sum) }} ₽</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="chart-card">
                        <h3>Топ товаров по сумме трат</h3>
                        <div class="item-list">
                            <div v-for="(item, index) in topItemsBySum" :key="item.name" class="item-row">
                                <div class="item-rank">{{ index + 1 }}</div>
                                <img :src="getItemImage(item.name)" :alt="item.name" class="item-img" @error="handleImageError">
                                <div class="item-info">
                                    <div class="item-name">{{ item.name }}</div>
                                    <div class="item-category">{{ item.category }}</div>
                                    <div class="bar-container">
                                        <div class="bar-fill" :style="{ width: (item.sum / topItemsBySum[0].sum * 100) + '%' }"></div>
                                    </div>
                                </div>
                                <div class="item-value">
                                    <div class="item-count">{{ formatMoney(item.sum) }} ₽</div>
                                    <div class="item-sum">{{ item.count }} заказов</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </div>

                const selectedCategory = ref('all');

                const categories = computed(() => {
                    return [...new Set(positions.value.map(p => p.category))].sort();
                });

                const filteredOrders = computed(() => {
                    let filtered = orders.value;
                    
                    // Фильтр по дате — последние 24 месяца
                    if (filtered.length > 0) {
                        let maxDate = new Date(filtered[0].date);
                        for (let i = 1; i < filtered.length; i++) {
                            const d = new Date(filtered[i].date);
                            if (d > maxDate) maxDate = d;
                        }
                        const minDate = new Date(maxDate);
                        minDate.setMonth(minDate.getMonth() - 23);
                        
                        filtered = filtered.filter(o => new Date(o.date) >= minDate);
                    }
                    
                    // Фильтр по категории
                    if (selectedCategory.value !== 'all') {
                        filtered = filtered.filter(o => o.category === selectedCategory.value);
                    }
                    return filtered;
                });

                const totalOrders = computed(() => {
                    return new Set(filteredOrders.value.map(o => o.order_id)).size;
                });

                const totalSpent = computed(() => {
                    return filteredOrders.value.reduce((sum, o) => sum + o.sum, 0);
                });

                const avgCheck = computed(() => {
                    return totalOrders.value > 0 ? totalSpent.value / totalOrders.value : 0;
                });

                const avgDiscount = computed(() => {
                    const withDiscount = filteredOrders.value.filter(o => o.price_no_discount > 0);
                    if (withDiscount.length === 0) return 0;
                    return withDiscount.reduce((sum, o) => sum + (o.discount / o.price_no_discount * 100), 0) / withDiscount.length;
                });

                const monthlyData = computed(() => {
                    const data = {};
                    filteredOrders.value.forEach(o => {
                        const date = new Date(o.date);
                        const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
                        if (!data[key]) {
                            data[key] = { orders: new Set(), spent: 0, discountSum: 0, discountCount: 0 };
                        }
                        data[key].orders.add(o.order_id);
                        data[key].spent += o.sum;
                        if (o.price_no_discount > 0) {
                            data[key].discountSum += (o.discount / o.price_no_discount * 100);
                            data[key].discountCount++;
                        }
                    });

                    return Object.entries(data)
                        .map(([month, d]) => ({
                            month,
                            orders: d.orders.size,
                            spent: d.spent,
                            avgDiscount: d.discountCount > 0 ? d.discountSum / d.discountCount : 0
                        }))
                        .sort((a, b) => a.month.localeCompare(b.month));
                });

                const categoryData = computed(() => {
                    const data = {};
                    filteredOrders.value.forEach(o => {
                        if (!data[o.category]) {
                            data[o.category] = { count: 0, sum: 0 };
                        }
                        data[o.category].count++;
                        data[o.category].sum += o.sum;
                    });
                    return Object.entries(data).map(([name, d]) => ({ name, ...d })).sort((a, b) => b.count - a.count);
                });

                const topItemsByCount = computed(() => {
                    const data = {};
                    filteredOrders.value.forEach(o => {
                        if (!data[o.item]) {
                            data[o.item] = { name: o.item, category: o.category, count: 0, sum: 0 };
                        }
                        data[o.item].count += o.quantity;
                        data[o.item].sum += o.sum;
                    });
                    return Object.values(data).sort((a, b) => b.count - a.count).slice(0, 15);
                });

                const topItemsBySum = computed(() => {
                    const data = {};
                    filteredOrders.value.forEach(o => {
                        if (!data[o.item]) {
                            data[o.item] = { name: o.item, category: o.category, count: 0, sum: 0 };
                        }
                        data[o.item].count += o.quantity;
                        data[o.item].sum += o.sum;
                    });
                    return Object.values(data).sort((a, b) => b.sum - a.sum).slice(0, 15);
                });

                const getItemImage = (itemName) => {
                    const pos = positions.value.find(p => p.name === itemName);
                    if (pos && pos.file) {
                        return `items/items/${pos.file}`;
                    }
                    return '';
                };

                const handleImageError = (e) => {
                    e.target.style.display = 'none';
                };

                const formatNumber = (n) => n.toLocaleString('ru-RU');
                const formatMoney = (n) => n.toLocaleString('ru-RU', { maximumFractionDigits: 0 });

                // D3 Charts
                const ordersChart = ref(null);
                const spentChart = ref(null);
                const discountChart = ref(null);
                const categoryPie = ref(null);
                const categorySpentPie = ref(null);

                const drawLineChart = (el, data, yKey, yLabel, color, formatY) => {
                    if (!el) return;
                    el.innerHTML = '';

                    const margin = { top: 20, right: 30, bottom: 70, left: 60 };
                    const width = el.clientWidth - margin.left - margin.right;
                    const height = 300 - margin.top - margin.bottom;

                    const svg = d3.select(el)
                        .append('svg')
                        .attr('width', width + margin.left + margin.right)
                        .attr('height', height + margin.top + margin.bottom)
                        .append('g')
                        .attr('transform', `translate(${margin.left},${margin.top})`);

                    const x = d3.scaleBand()
                        .domain(data.map(d => d.month))
                        .range([0, width])
                        .padding(0.3);

                    const yMax = d3.max(data, d => d[yKey]);
                    const y = d3.scaleLinear()
                        .domain([0, yMax * 1.1])
                        .range([height, 0])
                        .nice();

                    // Grid
                    svg.append('g')
                        .attr('class', 'd3-grid')
                        .call(d3.axisLeft(y).tickSize(-width).tickFormat(''));

                    // X Axis — повёрнутые подписи
                    svg.append('g')
                        .attr('class', 'd3-axis')
                        .attr('transform', `translate(0,${height})`)
                        .call(d3.axisBottom(x).tickFormat(d => {
                            const [yr, m] = d.split('-');
                            return `${m}.${yr.slice(2)}`;
                        }))
                        .selectAll('text')
                        .attr('transform', 'rotate(-45)')
                        .style('text-anchor', 'end')
                        .attr('dx', '-0.5em')
                        .attr('dy', '0.5em');

                    // Y Axis — целые значения без повторов
                    svg.append('g')
                        .attr('class', 'd3-axis')
                        .call(d3.axisLeft(y).ticks(Math.min(yMax, 10)).tickFormat(d3.format('d')));

                    // Line
                    const line = d3.line()
                        .x(d => x(d.month) + x.bandwidth() / 2)
                        .y(d => y(d[yKey]))
                        .curve(d3.curveMonotoneX);

                    svg.append('path')
                        .datum(data)
                        .attr('fill', 'none')
                        .attr('stroke', color)
                        .attr('stroke-width', 3)
                        .attr('d', line);

                    // Dots
                    svg.selectAll('.dot')
                        .data(data)
                        .enter()
                        .append('circle')
                        .attr('cx', d => x(d.month) + x.bandwidth() / 2)
                        .attr('cy', d => y(d[yKey]))
                        .attr('r', 5)
                        .attr('fill', color)
                        .on('mouseover', function(event, d) {
                            d3.select(this).attr('r', 8);
                            // Tooltip
                            const tooltip = d3.select('body').append('div')
                                .attr('class', 'tooltip')
                                .style('left', (event.pageX + 10) + 'px')
                                .style('top', (event.pageY - 30) + 'px')
                                .html(`<strong>${d.month}</strong><br>${yLabel}: ${formatY(d[yKey])}`);
                        })
                        .on('mouseout', function() {
                            d3.select(this).attr('r', 5);
                            d3.selectAll('.tooltip').remove();
                        });
                };

                const drawBarChart = (el, data, valueKey, title, formatValue) => {
                    if (!el) return;
                    el.innerHTML = '';

                    const margin = { top: 20, right: 100, bottom: 40, left: 320 };
                    const width = el.clientWidth - margin.left - margin.right;
                    const height = Math.max(300, data.length * 35) - margin.top - margin.bottom;

                    const svg = d3.select(el)
                        .append('svg')
                        .attr('width', width + margin.left + margin.right)
                        .attr('height', height + margin.top + margin.bottom)
                        .append('g')
                        .attr('transform', `translate(${margin.left},${margin.top})`);

                    const y = d3.scaleBand()
                        .domain(data.map(d => d.name))
                        .range([0, height])
                        .padding(0.2);

                    const x = d3.scaleLinear()
                        .domain([0, d3.max(data, d => d[valueKey]) * 1.1])
                        .range([0, width])
                        .nice();

                    // Grid
                    svg.append('g')
                        .attr('class', 'd3-grid')
                        .call(d3.axisBottom(x).tickSize(height).tickFormat(''));

                    // X Axis
                    svg.append('g')
                        .attr('class', 'd3-axis')
                        .attr('transform', `translate(0,${height})`)
                        .call(d3.axisBottom(x).ticks(5).tickFormat(d3.format(',.0f')));

                    // Y Axis
                    svg.append('g')
                        .attr('class', 'd3-axis')
                        .call(d3.axisLeft(y));

                    // Bars
                    svg.selectAll('.bar')
                        .data(data)
                        .enter()
                        .append('rect')
                        .attr('class', 'bar')
                        .attr('y', d => y(d.name))
                        .attr('height', y.bandwidth())
                        .attr('x', 0)
                        .attr('width', 0)
                        .attr('fill', '#ffd700')
                        .attr('rx', 4)
                        .on('mouseover', function(event, d) {
                            d3.select(this).attr('fill', '#ffaa00');
                            const tooltip = d3.select('body').append('div')
                                .attr('class', 'tooltip')
                                .style('left', (event.pageX + 10) + 'px')
                                .style('top', (event.pageY - 30) + 'px')
                                .html(`<strong>${d.name}</strong><br>${title}: ${formatValue(d[valueKey])}`);
                        })
                        .on('mouseout', function() {
                            d3.select(this).attr('fill', '#ffd700');
                            d3.selectAll('.tooltip').remove();
                        })
                        .transition()
                        .duration(800)
                        .attr('width', d => x(d[valueKey]));

                    // Value labels
                    svg.selectAll('.label')
                        .data(data)
                        .enter()
                        .append('text')
                        .attr('class', 'label')
                        .attr('y', d => y(d.name) + y.bandwidth() / 2)
                        .attr('x', d => x(d[valueKey]) + 5)
                        .attr('dy', '0.35em')
                        .attr('fill', '#e8e8e8')
                        .attr('font-size', '12px')
                        .text(d => formatValue(d[valueKey]));
                };

                const renderCharts = () => {
                    drawLineChart(ordersChart.value, monthlyData.value, 'orders', 'Заказы', '#ffd700', d3.format(',.0f'));
                    drawLineChart(spentChart.value, monthlyData.value, 'spent', 'Траты ₽', '#4ecdc4', d => d3.format(',.0f')(d) + ' ₽');
                    drawLineChart(discountChart.value, monthlyData.value, 'avgDiscount', 'Скидка %', '#ff6b6b', d => d.toFixed(1) + '%');

                    // Category bar charts
                    if (selectedCategory.value === 'all') {
                        const catCount = [...categoryData.value].sort((a, b) => b.count - a.count);
                        const catSum = [...categoryData.value].sort((a, b) => b.sum - a.sum);
                        drawBarChart(categoryPie.value, catCount, 'count', 'Заказы', d3.format(',.0f'));
                        drawBarChart(categorySpentPie.value, catSum, 'sum', 'Траты ₽', d => d3.format(',.0f')(d) + ' ₽');
                    } else {
                        const itemsCount = [...topItemsByCount.value].sort((a, b) => b.count - a.count);
                        const itemsSum = [...topItemsBySum.value].sort((a, b) => b.sum - a.sum);
                        drawBarChart(categoryPie.value, itemsCount, 'count', 'Заказы', d3.format(',.0f'));
                        drawBarChart(categorySpentPie.value, itemsSum, 'sum', 'Траты ₽', d => d3.format(',.0f')(d) + ' ₽');
                    }
                };

                onMounted(async () => {
                    loading.value = false;
                    await new Promise(r => setTimeout(r, 100));
                    renderCharts();
                });

                watch(selectedCategory, () => {
                    renderCharts();
                });

                return {
                    loading,
                    orders,
                    positions,
                    selectedCategory,
                    categories,
                    totalOrders,
                    totalSpent,
                    avgCheck,
                    avgDiscount,
                    topItemsByCount,
                    topItemsBySum,
                    getItemImage,
                    handleImageError,
                    formatNumber,
                    formatMoney,
                    ordersChart,
                    spentChart,
                    discountChart,
                    categoryPie,
                    categorySpentPie
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
